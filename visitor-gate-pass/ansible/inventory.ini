# Ansible Inventory for Automated Residential Visitor Gate-Pass System

[local]
localhost ansible_connection=local ansible_python_interpreter=auto

[staging]
staging-app-01.gatepass.local ansible_host=192.168.1.50 ansible_user=deploy

[production]
prod-app-01.gatepass.local ansible_host=192.168.1.100 ansible_user=deploy
prod-app-02.gatepass.local ansible_host=192.168.1.101 ansible_user=deploy

[webservers:children]
staging
production
local

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
deploy_env=production
app_port=8080
db_port=3307
