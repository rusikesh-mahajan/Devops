---
- name: Provision and Deploy Automated Residential Visitor Gate-Pass System
  hosts: webservers
  become: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: 1. Display Provisioning Plan
      debug:
        msg: "Starting provisioning for {{ app_name }} (v{{ app_version }}) on target {{ inventory_hostname }}"

    - name: 2. Ensure application directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ deploy_dir }}"
        - "{{ config_dir }}"
        - "{{ deploy_dir }}/logs"
        - "{{ deploy_dir }}/backups"

    - name: 3. Verify Docker runtime availability
      command: docker --version
      register: docker_version
      changed_when: false

    - name: 4. Display Docker version
      debug:
        msg: "Detected runtime: {{ docker_version.stdout }}"

    - name: 5. Template application environment configuration
      copy:
        content: |
          # Generated by Ansible Provisioning Automation
          APP_NAME={{ app_name }}
          APP_VERSION={{ app_version }}
          SERVER_PORT={{ app_port }}
          DB_URL=jdbc:mysql://db:3306/{{ db_name }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME={{ db_user }}
          DB_PASSWORD={{ db_password }}
          SPRING_PROFILES_ACTIVE=prod
        dest: "{{ config_dir }}/.env"
        mode: '0600'
      notify: Restart Application Containers

    - name: 6. Deploy / Update containers via Docker Compose
      shell: "docker compose -f {{ docker_compose_file }} up -d"
      args:
        chdir: "{{ playbook_dir }}"
      register: compose_deploy
      changed_when: "'Started' in compose_deploy.stdout or 'Recreated' in compose_deploy.stdout or 'Created' in compose_deploy.stdout"

    - name: 7. Wait for Application Healthcheck Endpoint
      uri:
        url: "{{ healthcheck_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: health_result
      until: health_result.status == 200 and 'UP' in health_result.content
      retries: "{{ healthcheck_retries }}"
      delay: "{{ healthcheck_delay }}"

    - name: 8. Confirm Deployment Health Status
      debug:
        msg: "Application is HEALTHY: {{ health_result.content }}"

  handlers:
    - name: Restart Application Containers
      shell: "docker compose -f {{ docker_compose_file }} restart app"
      args:
        chdir: "{{ playbook_dir }}"
