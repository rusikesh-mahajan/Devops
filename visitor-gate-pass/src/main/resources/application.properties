# Server configuration
server.port=8080

# Application Name
spring.application.name=visitor-gate-pass

# Database Configuration (Overridable via Environment Variables for Docker/Ansible)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gatepass_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Expose Actuator health endpoint for CI/CD checks
management.endpoints.web.exposure.include=health
