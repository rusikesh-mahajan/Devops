<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied | GatePass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Outfit', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .error-icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 20px;
        }
        .btn-return {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px 24px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn-return:hover {
            background: #7dd3fc;
            color: #0f172a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bi bi-shield-slash-fill error-icon"></i>
        <h2 class="fw-bold mb-2">Access Denied (403)</h2>
        <p class="text-secondary mb-3">You do not have administrative or authorized permissions to access this page or API endpoint.</p>
        <div class="p-2 mb-3 bg-dark rounded border border-secondary small text-warning" th:if="${username}">
            Logged in as: <strong>[[${username}]]</strong> (Role: [[${role}]])
        </div>
        <a th:href="${redirectUrl}" class="btn-return">
            <i class="bi bi-arrow-left me-1"></i> Return to Authorized Dashboard
        </a>
    </div>
</body>
</html>
