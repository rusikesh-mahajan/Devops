<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Visitor Gate Pass System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --primary-glow: rgba(56, 189, 248, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #0284c7;
            --btn-hover: #0369a1;
        }
        body { 
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color));
            background-attachment: fixed;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        /* Animated background elements */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: rgba(56, 189, 248, 0.15);
            top: 10%; left: 20%;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: rgba(168, 85, 247, 0.15);
            bottom: 10%; right: 15%;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }
        
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
        
        .login-wrapper h3 {
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-label {
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .form-control {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.28);
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control::placeholder,
        input::placeholder {
            color: #94a3b8 !important;
            opacity: 1 !important;
            font-weight: 400;
        }
        
        .form-control:focus {
            background: rgba(30, 41, 59, 0.98);
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
            color: white;
        }
        .form-control:focus::placeholder {
            color: #cbd5e1 !important;
        }
        
        .btn-primary {
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 var(--primary-glow);
        }
        
        .btn-primary:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 var(--primary-glow);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .demo-creds {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
        
        .demo-creds span {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 6px;
            margin: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">
        <h3 id="app-title">Gate-Pass System</h3>
        <div th:if="${param.error}" class="alert alert-danger" id="error-msg">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success" id="logout-msg">You have been logged out.</div>
        <form th:action="@{/login}" method="post" id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="login-btn">Secure Login</button>
        </form>
        <div class="demo-creds">
            <div>Demo Accounts</div>
            <span>admin / admin123</span>
            <span>guard1 / guard123</span>
            <span>resident1 / res123</span>
        </div>
    </div>
</body>
</html>
